# Separate bucket for encrypted archives and the independent deletion journal.
# Provision only in eu-central-1. RetentionDays requires the owner's approved policy.
AWSTemplateFormatVersion: '2010-09-09'
Description: Hittumst encrypted recovery archives and independent deletion journal
Parameters:
  BackupBucketName:
    Type: String
    MinLength: 3
    MaxLength: 63
    AllowedPattern: '[a-z0-9][a-z0-9-]+[a-z0-9]'
  BackupRetentionDays:
    Type: Number
    MinValue: 1
    MaxValue: 365
    Description: Owner-approved encrypted backup retention, separate from deletion tombstones
Resources:
  BackupBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BackupBucketName
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ApprovedArchiveRetention
            Status: Enabled
            Prefix: backups/
            ExpirationInDays: !Ref BackupRetentionDays
            NoncurrentVersionExpiration:
              NoncurrentDays: !Ref BackupRetentionDays
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
  BackupBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BackupBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt BackupBucket.Arn
              - !Sub '${BackupBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          - Sid: RequireCreateOnlyDeletionJournal
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub '${BackupBucket.Arn}/deletions/*'
            Condition:
              'Null':
                s3:if-none-match: 'true'
  DeletionPublisherPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Worker can create/read encrypted tombstones; no delete or archive access
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: s3:PutObject
            Resource: !Sub '${BackupBucket.Arn}/deletions/*/*/records/*'
            Condition:
              StringEquals:
                aws:RequestedRegion: eu-central-1
          - Effect: Allow
            Action: s3:GetObject
            Resource:
              - !Sub '${BackupBucket.Arn}/deletions/*/*/records/*'
              - !Sub '${BackupBucket.Arn}/deletions/*/*/initialized.enc'
            Condition:
              StringEquals:
                aws:RequestedRegion: eu-central-1
  RecoveryOperatorPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Separate offline recovery operator; never distribute to members
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: s3:ListBucket
            Resource: !GetAtt BackupBucket.Arn
            Condition:
              StringLike:
                s3:prefix:
                  - deletions/*
                  - backups/*
          - Effect: Allow
            Action: s3:GetObject
            Resource:
              - !Sub '${BackupBucket.Arn}/deletions/*'
              - !Sub '${BackupBucket.Arn}/backups/*'
          - Effect: Allow
            Action: s3:PutObject
            Resource:
              - !Sub '${BackupBucket.Arn}/deletions/*/initialized.enc'
              - !Sub '${BackupBucket.Arn}/backups/*'
Outputs:
  BackupBucketName:
    Value: !Ref BackupBucket
  DeletionPublisherPolicyArn:
    Value: !Ref DeletionPublisherPolicy
  RecoveryOperatorPolicyArn:
    Value: !Ref RecoveryOperatorPolicy
