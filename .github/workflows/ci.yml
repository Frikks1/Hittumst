name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - run: npm run check
      - run: npm run build --workspace @rummal/admin
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_configuration_only
      - run: npm run build:web --workspace @rummal/mobile -- --output-dir dist-ci
        env:
          EXPO_PUBLIC_APP_ENV: staging
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_configuration_only
          EXPO_PUBLIC_DEV_BYPASS_AUTH: 'false'
          EXPO_PUBLIC_HITTINGAR_ENABLED: 'false'

  functions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.8.0
      - run: deno check --node-modules-dir=none --config supabase/functions/deno.json supabase/functions/push-worker/index.ts supabase/functions/place-search/index.ts

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        installation: [clean, upgrade]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: matrix.installation == 'upgrade'
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.19.1
        if: matrix.installation == 'upgrade'
      - run: npm ci
        if: matrix.installation == 'upgrade'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - run: supabase start
      - run: supabase db reset --local
        if: matrix.installation == 'clean'
      - run: supabase db reset --local --version 20260831150105
        if: matrix.installation == 'upgrade'
      - run: node scripts/rehearse-baseline-upgrade.mjs prepare
        if: matrix.installation == 'upgrade'
      - run: supabase migration up --local
        if: matrix.installation == 'upgrade'
      - run: node scripts/rehearse-baseline-upgrade.mjs verify
        if: matrix.installation == 'upgrade'
      - run: supabase test db
      - run: supabase db lint --local --schema public,private --level error --fail-on error
