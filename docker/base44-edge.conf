# Preview entry point (host port 3000) for the Expo dev server in `apps/mobile`.
#
# Expo CLI's dev-server CORS middleware rejects any request whose Origin header
# does not match the Host it receives. Behind the preview proxy the browser's
# origin is the public host (https://3000-<BASE44_PUBLIC_HOST_SUFFIX>) while the
# sandbox receives Host = <port>-<sandbox id>.$BASE44_SANDBOX_HOST_DOMAIN, so
# Metro answered bundle, /hot (HMR) and /logs requests with
# "Unauthorized request from ...". Deriving Origin from the incoming Host makes
# every request look same-origin to Expo, without touching the app config.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 3000;
    server_name _;

    # Metro streams the web bundle and holds the HMR websocket open.
    proxy_buffering off;
    proxy_read_timeout 3600s;
    client_max_body_size 64m;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Origin http://$http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Never cache a dev server response.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }
}
