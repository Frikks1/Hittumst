name: hittumst-base44

# Base44 development environment for the Hittumst workspace.
#
#   edge (port 3000) — preview entry point: an nginx same-origin proxy in front of
#                     the `app` service's Expo dev server (see docker/base44-edge.conf).
#   app              — the social/dating product: apps/mobile, the Expo React Native
#                     client, served as a web app so it is viewable in the preview.
#                     Uses the app's seeded offline demo data; no credentials needed.
#   web (port 3001) — apps/admin, the Next.js public bilingual website ("/") and the
#                     moderation console, also credential-free via its demo mode.
#
# The local Supabase CLI stack is not part of this environment: neither surface
# requires it, and `supabase start` would need nested Docker.

x-app-image: &app-image
  image: hittumst-base44-dev:local
  build:
    context: .
    dockerfile: docker/base44-dev.Dockerfile

services:
  # Installs the workspace dependencies from the lockfile and repairs the
  # expo-router hoisting, then exits. Both app services wait for it so they never
  # install against the shared node_modules concurrently.
  deps:
    <<: *app-image
    working_dir: /app
    command: ["sh", "/app/docker/base44-entrypoint.sh", "sh", "-c", "echo dependencies ready"]
    restart: "no"
    volumes:
      - ./:/app

  # Preview entry point: proxies the Expo dev server so the browser sees a
  # same-origin dev server (see docker/base44-edge.conf).
  edge:
    image: nginx:alpine
    restart: on-failure
    depends_on:
      app:
        condition: service_started
    ports:
      - "3000:3000"
    volumes:
      - ./docker/base44-edge.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:3000/
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 4

  # The social app (Expo / React Native); reached through the `edge` proxy.
  app:
    <<: *app-image
    working_dir: /app
    command:
      - sh
      - /app/docker/base44-entrypoint.sh
      - npm
      - run
      - web
      - --workspace
      - "@rummal/mobile"
      - --
      - --port
      - "3000"
    restart: on-failure
    depends_on:
      deps:
        condition: service_completed_successfully
    volumes:
      - ./:/app
    env_file:
      - path: /run/base44/app.env
        required: false
    environment:
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_APP_ENV: development
      # Development-only previewing switch: seeded demo data, no sign-in and no
      # Iceland location check (see apps/mobile/README.md). Ignored in staging/production.
      EXPO_PUBLIC_DEV_BYPASS_AUTH: "true"
      # Shows the Hittingar tab.
      EXPO_PUBLIC_HITTINGAR_ENABLED: "true"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>r.text()).then(t=>process.exit(t.includes('expo-reset')?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 4

  # Public website plus moderation console (Next.js).
  web:
    <<: *app-image
    working_dir: /app
    command:
      - sh
      - /app/docker/base44-entrypoint.sh
      - npm
      - run
      - dev
      - --workspace
      - "@rummal/admin"
      - --
      - --port
      - "3001"
      - --hostname
      - 0.0.0.0
    restart: on-failure
    depends_on:
      deps:
        condition: service_completed_successfully
    ports:
      - "3001:3001"
    volumes:
      - ./:/app
    env_file:
      # Platform-managed secrets (absent in the demo-mode setup); last so a
      # dashboard value always wins over anything set here.
      - path: /run/base44/app.env
        required: false
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      HITTUMST_APP_ENV: development
      NEXT_PUBLIC_APP_URL: https://3001-${BASE44_PUBLIC_HOST_SUFFIX}
      # Read by apps/admin/next.config.ts to accept this app's origin for dev
      # assets, Server Actions and iframe framing.
      BASE44_PUBLIC_HOST_SUFFIX: ${BASE44_PUBLIC_HOST_SUFFIX}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      start_period: 600s
      retries: 4
