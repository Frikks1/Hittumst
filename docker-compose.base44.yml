name: hittumst-base44

# Base44 development environment for the Hittumst workspace.
# Runs the Next.js app (apps/admin): the public bilingual website at "/" and the
# moderation console under "/dashboard" and friends. With no Supabase variables
# present the app serves its built-in demo data, so it boots without credentials.
# Local Supabase/Postgres is not needed for this surface.

services:
  web:
    build:
      context: .
      dockerfile: docker/base44-dev.Dockerfile
    working_dir: /app
    # The wrapper script installs from the lockfile on first start (and again
    # when the lockfile changes), then runs the live-reload dev server.
    command:
      - sh
      - /app/docker/base44-entrypoint.sh
      - npm
      - run
      - dev
      - --workspace
      - "@rummal/admin"
      - --
      - --port
      - "3000"
      - --hostname
      - 0.0.0.0
    restart: on-failure
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
    env_file:
      # Platform-managed secrets (absent for the demo-mode setup); last so a
      # dashboard value always wins over anything set here.
      - path: /run/base44/app.env
        required: false
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      HITTUMST_APP_ENV: development
      # Public preview origin, used for auth redirects and link building.
      NEXT_PUBLIC_APP_URL: https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      # Read by apps/admin/next.config.ts to accept the preview origin for dev
      # assets, Server Actions and iframe framing.
      BASE44_PUBLIC_HOST_SUFFIX: ${BASE44_PUBLIC_HOST_SUFFIX}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      start_period: 600s
      retries: 4
