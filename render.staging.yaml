# First deployment: staging only. See docs/render-deployment.md for required secrets.
# Keep each resource managed by exactly one Blueprint.
services:
  - type: web
    name: hittumst-staging-web
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/operations/live
    autoDeployTrigger: off
    envVars:
      - fromGroup: hittumst-staging
      - key: WORKER_EXECUTION_ROLE
        value: web
  - type: worker
    name: hittumst-staging-worker
    runtime: docker
    region: frankfurt
    plan: 1c-2g
    dockerfilePath: ./Dockerfile
    dockerCommand: node apps/admin/dist-worker/worker.mjs
    maxShutdownDelaySeconds: 300
    autoDeployTrigger: off
    envVars:
      - fromGroup: hittumst-staging
      - key: WORKER_EXECUTION_ROLE
        value: worker
envVarGroups:
  - name: hittumst-staging
    envVars:
      - key: HITTUMST_APP_ENV
        value: staging
      - key: STAGING_SYNTHETIC_DATA_CONFIRMED
        value: "true"
      - key: WORKER_SCHEDULER
        value: render
      - key: AWS_REGION
        value: eu-central-1
      - key: AWS_MEDIA_PRIVACY_VERIFIED
        value: "false"
      - key: HITTUMST_GROUP_VOICE_ENABLED
        value: "false"
      - key: HITTUMST_PUBLIC_RELEASE
        value: "false"
      - key: HITTUMST_POLICIES_APPROVED
        value: "false"
      - key: COMMERCE_MODE
        value: disabled
      - key: CRON_SECRET
        generateValue: true
      - key: PUSH_WORKER_SECRET
        generateValue: true
      - key: VOICE_WORKER_SECRET
        generateValue: true
